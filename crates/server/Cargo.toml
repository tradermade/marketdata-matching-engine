[package]
name = "tm-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Paper-trading exchange: tm-engine + TraderMade WebSocket V2 liquidity"

[dependencies]
tm-engine = { path = "../engine" }
anyhow = "1"
axum = { version = "0.7", features = ["ws"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
crossbeam-channel = "0.5"
dotenvy = "0.15"
futures-util = "0.3"
hdrhistogram = "7"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal"] }
# Same pin as TraderMade's Rust WebSocket tutorial.
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-native-roots"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
